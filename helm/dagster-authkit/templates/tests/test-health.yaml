apiVersion: v1
kind: Pod
metadata:
  name: {{ include "dagster-authkit.fullname" . }}-test-health
  labels:
    {{- include "dagster-authkit.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  securityContext:
    {{- toYaml .Values.podSecurityContext | nindent 4 }}
  containers:
    - name: health
      image: {{ include "dagster-authkit.image" . | quote }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      command:
        - python
        - -c
        - |
          import urllib.request
          url = "http://{{ include "dagster-authkit.fullname" . }}:{{ .Values.service.port }}/auth/health?type=ready"
          print(urllib.request.urlopen(url, timeout=10).read().decode())
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
