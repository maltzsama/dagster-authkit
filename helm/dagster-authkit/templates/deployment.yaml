{{- if and (contains "sqlite" .Values.authkit.databaseUrl) (or (gt (int .Values.replicaCount) 1) .Values.autoscaling.enabled) }}
{{- fail "SQLite cannot be used with replicaCount > 1 or HPA: the database file lives on a single volume and Redis does not share it. Set authkit.databaseUrl to a PostgreSQL/MySQL DSN, or set replicaCount=1 and disable autoscaling." }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dagster-authkit.fullname" . }}
  labels:
    {{- include "dagster-authkit.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  {{- if .Values.strategy }}
  strategy:
    {{- toYaml .Values.strategy | nindent 4 }}
  {{- else if .Values.persistence.enabled }}
  # A rolling update can deadlock on the ReadWriteOnce data volume: the new
  # pod waits for a volume the old pod still holds.
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "dagster-authkit.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if not .Values.authkit.existingSecret }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "dagster-authkit.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "dagster-authkit.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        # Dagster refuses to start unless DAGSTER_HOME already exists, and on a
        # fresh volume it does not.
        - name: init-dagster-home
          image: {{ include "dagster-authkit.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["sh", "-c", "mkdir -p \"$DAGSTER_HOME\""]
          env:
            - name: DAGSTER_HOME
              value: {{ .Values.dagster.home | quote }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: {{ .Chart.Name }}
          image: {{ include "dagster-authkit.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          args:
            - -h
            - "0.0.0.0"
            - -p
            - "{{ .Values.service.port }}"
            {{- if .Values.dagster.workspace.module }}
            - -m
            - {{ .Values.dagster.workspace.module | quote }}
            {{- else if .Values.dagster.workspace.file }}
            - -f
            - {{ .Values.dagster.workspace.file | quote }}
            {{- else }}
            - --empty-workspace
            {{- end }}
            {{- with .Values.dagster.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "dagster-authkit.fullname" . }}-config
            - secretRef:
                name: {{ .Values.authkit.existingSecret | default (printf "%s-secret" (include "dagster-authkit.fullname" .)) }}
          env:
            - name: DAGSTER_HOME
              value: {{ .Values.dagster.home | quote }}
            # The pod user has no home directory and the root filesystem is
            # read-only; Dagster writes to ~/.dagster.
            - name: HOME
              value: /tmp
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          startupProbe:
            httpGet:
              path: /auth/health?type=live
              port: http
            periodSeconds: {{ .Values.startupProbe.periodSeconds }}
            failureThreshold: {{ .Values.startupProbe.failureThreshold }}
          livenessProbe:
            httpGet:
              path: /auth/health?type=live
              port: http
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /auth/health?type=ready
              port: http
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "dagster-authkit.fullname" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
