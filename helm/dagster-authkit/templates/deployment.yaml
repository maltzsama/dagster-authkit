{{- $workspaceConfigMap := include "dagster-authkit.workspaceConfigMap" . }}
{{- $instanceConfigMap := include "dagster-authkit.instanceConfigMap" . }}
{{- $sources := 0 }}
{{- range (list .Values.dagster.workspace.module .Values.dagster.workspace.file $workspaceConfigMap) }}
{{- if . }}{{ $sources = add1 $sources }}{{ end }}
{{- end }}
{{- if gt $sources 1 }}
{{- fail "Set at most one of dagster.workspace.module, dagster.workspace.file and dagster.workspace.content/existingConfigMap." }}
{{- end }}
{{- if and (contains "sqlite" .Values.authkit.databaseUrl) (or (gt (int .Values.replicaCount) 1) .Values.autoscaling.enabled) }}
{{- fail "SQLite cannot be used with replicaCount > 1 or HPA: the database file lives on a single volume and Redis does not share it. Set authkit.databaseUrl to a PostgreSQL/MySQL DSN, or set replicaCount=1 and disable autoscaling." }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dagster-authkit.fullname" . }}
  labels:
    {{- include "dagster-authkit.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  {{- if .Values.strategy }}
  strategy:
    {{- toYaml .Values.strategy | nindent 4 }}
  {{- else if .Values.persistence.enabled }}
  # A rolling update can deadlock on the ReadWriteOnce data volume: the new
  # pod waits for a volume the old pod still holds.
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "dagster-authkit.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/dagster: {{ include (print $.Template.BasePath "/dagster-configmap.yaml") . | sha256sum }}
        {{- if not .Values.authkit.existingSecret }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "dagster-authkit.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "dagster-authkit.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        # Dagster refuses to start unless DAGSTER_HOME already exists, and on a
        # fresh volume it does not.
        - name: init-dagster-home
          image: {{ include "dagster-authkit.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["sh", "-c", "mkdir -p \"$DAGSTER_HOME\""]
          env:
            - name: DAGSTER_HOME
              value: {{ .Values.dagster.home | quote }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
        {{- with .Values.initContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: {{ include "dagster-authkit.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          args:
            - -h
            - "0.0.0.0"
            - -p
            - "{{ .Values.service.port }}"
            {{- if .Values.dagster.workspace.module }}
            - -m
            - {{ .Values.dagster.workspace.module | quote }}
            {{- else if .Values.dagster.workspace.file }}
            - -f
            - {{ .Values.dagster.workspace.file | quote }}
            {{- else if $workspaceConfigMap }}
            - -w
            - /opt/dagster/workspace/workspace.yaml
            {{- else }}
            - --empty-workspace
            {{- end }}
            {{- with .Values.dagster.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "dagster-authkit.fullname" . }}-config
            - secretRef:
                name: {{ .Values.authkit.existingSecret | default (printf "%s-secret" (include "dagster-authkit.fullname" .)) }}
            {{- with .Values.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            - name: DAGSTER_HOME
              value: {{ .Values.dagster.home | quote }}
            # The pod user has no home directory and the root filesystem is
            # read-only; Dagster writes to ~/.dagster.
            - name: HOME
              value: /tmp
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          startupProbe:
            httpGet:
              path: /auth/health?type=live
              port: http
            periodSeconds: {{ .Values.startupProbe.periodSeconds }}
            failureThreshold: {{ .Values.startupProbe.failureThreshold }}
          livenessProbe:
            httpGet:
              path: /auth/health?type=live
              port: http
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /auth/health?type=ready
              port: http
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            {{- if $workspaceConfigMap }}
            - name: workspace
              mountPath: /opt/dagster/workspace
              readOnly: true
            {{- end }}
            {{- if $instanceConfigMap }}
            - name: instance
              mountPath: {{ printf "%s/dagster.yaml" (.Values.dagster.home | trimSuffix "/") | quote }}
              subPath: dagster.yaml
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "dagster-authkit.fullname" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
        {{- if $workspaceConfigMap }}
        - name: workspace
          configMap:
            name: {{ $workspaceConfigMap }}
        {{- end }}
        {{- if $instanceConfigMap }}
        - name: instance
          configMap:
            name: {{ $instanceConfigMap }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
