# Default values for dagster-authkit.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: ghcr.io/maltzsama/dagster-authkit
  pullPolicy: IfNotPresent
  tag: ""  # Defaults to the chart's appVersion

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""  # Defaults to the release fullname, or to "default" when create=false

podAnnotations: {}
podLabels: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 3000

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: dagster.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Deployment strategy. When empty, defaults to Recreate if persistence is
# enabled (ReadWriteOnce volume) and to the Kubernetes default otherwise.
strategy: {}

# Time allowed for the webserver to start before liveness checks begin:
# periodSeconds * failureThreshold.
startupProbe:
  periodSeconds: 5
  failureThreshold: 60

resources: {}
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity: {}

# Extra environment for the webserver container.
extraEnv: []
# - name: DAGSTER_PG_PASSWORD
#   valueFrom:
#     secretKeyRef:
#       name: dagster-postgres
#       key: password
extraEnvFrom: []

# Extra volumes and mounts for the webserver container (e.g. user code).
extraVolumes: []
extraVolumeMounts: []

# Extra init containers, run after the chart's own.
initContainers: []

# --- Dagster AuthKit Configuration ---

authkit:
  backend: sql
  # Name of a pre-created Secret (Vault, External Secrets, etc.). It must hold
  # DAGSTER_AUTH_SECRET_KEY and may hold DAGSTER_AUTH_ADMIN_PASSWORD,
  # DAGSTER_AUTH_DATABASE_URL, DAGSTER_AUTH_REDIS_URL, DAGSTER_AUTH_METRICS_TOKEN,
  # DAGSTER_AUTH_SERVICE_TOKEN and DAGSTER_AUTH_LDAP_BIND_PASSWORD. Its keys
  # override anything set below. To keep credentials out of the ConfigMap, set
  # databaseUrl, redisUrl and metricsToken to "" and provide them in the Secret.
  existingSecret: ""
  secretKey: ""  # Used only if existingSecret is empty
  adminPassword: ""
  metricsToken: ""  # Optional — if set, required to access /auth/metrics

  # Static token for non-interactive API clients (e.g. Prometheus exporters).
  # Session backends only. With existingSecret, provide DAGSTER_AUTH_SERVICE_TOKEN there.
  serviceToken:
    token: ""  # Optional — min 32 chars; feature is off when empty
    header: Dagster-Cloud-Api-Token
    role: VIEWER
    user: service-token

  sessionMaxAge: 86400
  cookieSecure: true
  cookieSameSite: lax

  databaseUrl: sqlite:////data/dagster_auth.db

  redisUrl: ""  # Optional — enables distributed sessions and rate limiting

  rateLimit:
    enabled: true
    maxAttempts: 5
    windowSeconds: 300

  logLevel: INFO
  auditLog: true

  # --- Proxy Mode (when backend=proxy) ---
  proxy:
    trustedIPs: ""  # REQUIRED in proxy mode — comma-separated
    trustAll: false  # Opt-in to insecure default
    userHeader: Remote-User
    groupsHeader: Remote-Groups
    emailHeader: Remote-Email
    nameHeader: Remote-Name
    groupPattern: ""
    logoutUrl: ""  # REQUIRED in proxy mode — no default, must be explicitly set

  # --- RBAC ---
  rbac:
    unknownMutationRole: ADMIN
    restWriteRole: EDITOR

  # --- LDAP (when backend=ldap) ---
  ldap:
    server: ""
    baseDN: ""
    bindDN: ""
    bindPassword: ""
    userFilter: "(uid={username})"
    useTLS: false
    caCert: ""
    roleAttribute: ""
    groupPattern: ""
    timeout: 10

# --- Dagster ---
dagster:
  # What the webserver loads. Set at most one; with none it starts with
  # --empty-workspace.
  workspace:
    # Python module (-m) or file (-f). The code must exist in the image, or be
    # mounted with extraVolumes.
    module: ""
    file: ""
    # Inline workspace.yaml (-w), rendered into a ConfigMap. The usual choice on
    # Kubernetes: point it at gRPC code location servers.
    content: ""
    # content: |
    #   load_from:
    #     - grpc_server:
    #         host: my-code-location
    #         port: 3030
    #         location_name: my-code-location
    # Or an existing ConfigMap holding the key "workspace.yaml".
    existingConfigMap: ""

  # Dagster instance configuration (dagster.yaml), mounted into DAGSTER_HOME.
  # Without it Dagster stores runs and events in SQLite files under DAGSTER_HOME.
  # Storage and run launcher plugins (dagster-postgres, dagster-k8s, ...) are not
  # in the published image: build an image that adds them before referencing them.
  instance:
    content: ""
    # Or an existing ConfigMap holding the key "dagster.yaml".
    existingConfigMap: ""

  extraArgs: []
  home: /data/dagster_home

# --- Persistence for /data (SQLite user database and DAGSTER_HOME) ---
# When disabled, /data is an emptyDir: users and Dagster state are lost
# whenever the pod is recreated.
persistence:
  enabled: true
  size: 1Gi
  accessMode: ReadWriteOnce
