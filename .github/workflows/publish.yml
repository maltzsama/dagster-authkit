name: Publish Python Package

# Releases are cut manually: run this workflow from `main` (PyPI) or a
# `release/*` branch (TestPyPI). semantic-release computes the version from
# every commit since the last tag, so merges can be batched into one release.
on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  test:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  release:
    if: github.ref_name == 'main' || startsWith(github.ref_name, 'release/')
    runs-on: ubuntu-latest
    needs: test
    environment:
      name: ${{ startsWith(github.ref_name, 'main') && 'release' || 'test-release' }}
    outputs:
      released: ${{ steps.post.outputs.released }}
      tag: ${{ steps.post.outputs.tag }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv pip install --system python-semantic-release

      - name: Record pre-release tag
        id: pre
        run: echo "tag=$(git describe --tags --abbrev=0)" >> "$GITHUB_OUTPUT"

      - name: Create version with semantic-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: semantic-release version

      - name: Check if a release occurred
        id: post
        run: |
          before="${{ steps.pre.outputs.tag }}"
          after=$(git describe --tags --abbrev=0)
          echo "tag=$after" >> "$GITHUB_OUTPUT"
          if [ "$before" != "$after" ]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build package
        if: steps.post.outputs.released == 'true'
        run: uv build

      - name: Publish to TestPyPI (Trusted Publisher)
        if: steps.post.outputs.released == 'true' && startsWith(github.ref_name, 'release/')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

      - name: Publish to PyPI (Trusted Publisher)
        if: steps.post.outputs.released == 'true' && github.ref_name == 'main'
        uses: pypa/gh-action-pypi-publish@release/v1

  # Publishes ghcr.io/<owner>/dagster-authkit for the version just released.
  # A separate job so it can be re-run on its own if the push fails.
  image:
    name: Publish container image
    if: needs.release.outputs.released == 'true' && github.ref_name == 'main'
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags carry no "v" prefix so they match Chart.appVersion: 1.2.3, 1.2, latest.
      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release.outputs.tag }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
