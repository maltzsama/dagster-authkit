name: CI

on:
  workflow_call:

  push:
    branches: [main, 'release/*']

  pull_request:
    branches: [main, develop, 'release/*']

permissions:
  contents: read

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv pip install --system -e '.[dev,sqlite]'

      - name: Run linter (ruff)
        run: uv run ruff check .

      - name: Run tests with coverage
        run: |
          uv run pytest tests/ \
            --cov=dagster_authkit \
            --cov-branch \
            --cov-report=xml \
            --cov-report=term

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Archive test results (on failure)
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: pytest-results-${{ matrix.python-version }}
          path: |
            .pytest_cache/
            coverage.xml
          retention-days: 7

  image:
    name: Docker image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t dagster-authkit:ci .

      - name: Smoke test
        run: |
          docker run -d --name authkit -p 3000:3000 \
            -e DAGSTER_AUTH_SECRET_KEY=ci-secret-key-0123456789abcdef \
            -e DAGSTER_AUTH_ADMIN_PASSWORD=ci-admin-password \
            dagster-authkit:ci -h 0.0.0.0 -p 3000 --empty-workspace
          for i in $(seq 1 30); do
            if curl -fsS "http://localhost:3000/auth/health?type=ready"; then
              exit 0
            fi
            sleep 2
          done
          docker logs authkit
          exit 1

