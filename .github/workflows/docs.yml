name: Docs

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv pip install --system mkdocs mkdocs-material mkdocstrings[python]

      - name: Build docs
        run: mkdocs build

      - name: Inject visitor counter
        run: |
          python - <<'EOF'
          import pathlib
          snippet = '<script src="https://cdn.counter.dev/script.js" data-id="2a2c5d2b-5c34-4212-be47-a2e658d11dbf" data-utcoffset="2"></script>'
          for html in pathlib.Path("site").rglob("*.html"):
              text = html.read_text()
              if "cdn.counter.dev" not in text:
                  html.write_text(text.replace("</head>", f"{snippet}</head>", 1))
          EOF

      - name: Deploy to GitHub Pages
        run: ghp-import --no-jekyll --push --force site
